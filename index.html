<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex & Calcolatore Danni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPBAR / NAVIGAZIONE -->
  <header class="topbar" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #1e1e24; color: #fff;">
    <h1 style="font-size: 1.2rem; margin: 0;">Pokédex App</h1>
    
    <!-- Menu di Navigazione -->
    <select id="app-navigation-select" style="padding: 8px 12px; border-radius: 6px; background: #2b2b36; color: #fff; border: 1px solid #444; font-weight: bold;">
      <option value="pokedex">📖 Pokédex</option>
      <option value="damage-calc">⚔️ Calcolo Danni</option>
    </select>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    
    <!-- SEZIONE 1: POKÉDEX -->
    <section id="main-pokedex-view" style="display: block;">
      <div style="margin-bottom: 20px;">
        <input type="text" id="search-input" placeholder="Cerca Pokémon..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1e1e24; color: #fff;">
      </div>
      <div id="pokedex-grid" class="grid-container">
        <!-- Card generati da app.js -->
      </div>
    </section>

    <!-- SEZIONE 2: CALCOLO DANNI -->
    <section id="damage-calc-view" style="display: none;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
        
        <!-- Box Attaccante (Pokémon A) -->
        <div id="box-a" style="background: #1e1e24; border: 1px solid #333; border-radius: 12px; padding: 20px;">
          <h2 style="font-size: 1.1rem; color: #a3e635; margin-bottom: 12px; font-weight: 800;">ATTACCANTE (POKÉMON A)</h2>
          <select id="select-pokemon-a" style="width: 100%; background: #2b2b36; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 16px;">
            <option value="">-- Seleziona Pokémon A --</option>
          </select>
          <div id="content-a"></div>
        </div>

        <!-- Box Difensore (Pokémon B) -->
        <div id="box-b" style="background: #1e1e24; border: 1px solid #333; border-radius: 12px; padding: 20px;">
          <h2 style="font-size: 1.1rem; color: #ef4444; margin-bottom: 12px; font-weight: 800;">DIFENSORE (POKÉMON B)</h2>
          <select id="select-pokemon-b" style="width: 100%; background: #2b2b36; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 16px;">
            <option value="">-- Seleziona Pokémon B --</option>
          </select>
          <div id="content-b"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- SCRIPT DELL'APPLICAZIONE -->
  <script src="Calcolo_Danni.js"></script>
  <script src="Calcolo_Danni_Engine.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dex Atlas — Pokedex</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  
  <div class="app-shell">
    <!-- TOPBAR -->
    <header class="topbar">
      <a href="#" class="brand">
        <div class="brand-mark"><i></i></div>
        <b>DEX ATLAS</b>
      </a>
      <div class="generation-pill"><span></span>National Dex · Z-A era</div>
      <button class="about-button" id="btn-about">Come funziona <span>↗</span></button>
    </header>

    <!-- HERO -->
    <section class="hero">
      <p class="eyebrow">POKEDEX · ENCICLOPEDIA DI TUTTE LE GENERAZIONI</p>
      <h1>Pokedex</h1>
      <p class="intro">Cerca un Pokémon per vedere le debolezze reali, oppure combina fino a due tipi per trovarne uno da catturare.</p>
    </section>

    <!-- CONTROLLI / FILTRI -->
    <section class="control-panel">
      <div class="search-wrap">
        <label for="search-input">Cerca per nome o numero</label>
        <div class="search-field">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Es. Charizard, Lucario o #0006" autocomplete="off" />
          <button id="btn-clear-search">×</button>
        </div>
        <div id="suggestions" class="suggestions"></div>
      </div>

      <div class="divider"></div>

      <div class="type-filter">
        <div class="filter-head">
          <label>Filtra per tipo</label>
          <button id="btn-reset-types">Reset</button>
        </div>
        <p>Scegli fino a <strong>2 tipi</strong></p>
        <div id="type-grid" class="type-grid"></div>
      </div>
    </section>

    <!-- GRIGLIA POKÉMON E DETTAGLIO -->
    <main class="content-grid">
      <!-- COLONNA SINISTRA: LISTA POKEMON -->
      <section class="pokemon-section">
        <div class="section-title">
          <span id="pokemon-count">0 POKÉMON</span>
          <div class="rule"></div>
          <button id="btn-sort" class="sort-button">Ordina: <span>Numero ↓</span></button>
        </div>
        
        <div id="pokemon-list" class="pokemon-list"></div>
        <button id="btn-load-more" class="load-more" style="display: none;">Carica altri</button>
      </section>

      <!-- COLONNA DESTRA: DETTAGLIO POKÉMON SELEZIONATO -->
      <aside class="detail-section">
        <div id="detail-card" class="detail-card">
          <div class="detail-empty">
            <div class="radar"><i></i></div>
            <p>Seleziona un Pokémon per vederne le informazioni</p>
          </div>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>

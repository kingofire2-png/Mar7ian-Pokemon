<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Sfondo pieno (nessuna trasparenza): richiesto per le icone "maskable", il sistema
       operativo applica la propria forma di ritaglio sopra questo sfondo. -->
  <rect width="512" height="512" fill="#0b0e14"/>
  <!-- Contenuto entro la safe zone maskable (cerchio inscritto all'80% di diametro, raggio
       ~204px da centro 256,256): la "M" resta leggibile qualunque sia il ritaglio del sistema. -->
  <text x="256" y="305" text-anchor="middle" font-family="Rajdhani, system-ui, sans-serif" font-weight="800" font-size="190" fill="url(#bg)">M</text>
</svg>
